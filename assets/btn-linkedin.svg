<svg xmlns="http://www.w3.org/2000/svg" width="200" height="46" viewBox="0 0 200 46" role="img" aria-label="Linkedin">
<title>Linkedin</title>
<style>
.fu{animation:fu .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fi{animation:fi 1s ease-out both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.cur{animation:blink 1.05s step-end infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(3.2);opacity:0}}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
<defs></defs>
<rect x="1" y="1" width="198" height="44" rx="10" fill="#080b10" stroke="#263243"/>
<path d="M5,15 V5 H15" fill="none" stroke="#3ee6c1" stroke-width="1.5"/>
<path d="M195,31 V41 H185" fill="none" stroke="#3ee6c1" stroke-width="1.5"/>
<text x="20" y="28" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#4f5b6b">02</text>
<text x="44" y="28" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.6" fill="#e8edf2">LINKEDIN</text>
<text x="180" y="28" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#3ee6c1">↗</text>
</svg>
