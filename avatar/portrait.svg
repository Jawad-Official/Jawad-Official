<svg xmlns="http://www.w3.org/2000/svg" width="250" height="301" viewBox="35 26 250 301">
  <!-- Flat cel-shaded portrait for the LED dot grid (about 4 px per dot).
       Outlines are one dot wide so they survive the conversion. -->
  <g stroke="#1c1626" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- blazer -->
    <path d="M6 360 C12 322 40 300 86 290 L128 278 L160 300 L192 278 L234 290 C280 300 308 322 314 360 Z" fill="#33508a"/>
    <path d="M234 290 C280 300 308 322 314 360 L262 360 C262 330 252 306 234 290 Z" fill="#284176" stroke="none"/>
    <!-- lapels -->
    <path d="M122 284 L96 304 L114 318 L104 330 L140 360 L156 360 Z" fill="#284176"/>
    <path d="M198 284 L224 304 L206 318 L216 330 L180 360 L164 360 Z" fill="#223765"/>
    <!-- shirt -->
    <path d="M130 282 L160 300 L190 282 L176 360 L144 360 Z" fill="#eef1f5"/>
    <path d="M160 300 L190 282 L176 360 L160 360 Z" fill="#c9d2de" stroke="none"/>
    <!-- collar points -->
    <path d="M124 280 L138 272 L158 312 L136 304 Z" fill="#f7f9fb"/>
    <path d="M196 280 L182 272 L162 312 L184 304 Z" fill="#d7dee8"/>
    <!-- lapel pin -->
    <circle cx="208" cy="320" r="4.5" fill="#3ee6c1" stroke="none"/>

    <!-- neck -->
    <path d="M136 232 L136 290 L160 304 L184 290 L184 232 Z" fill="#d08b62"/>
    <path d="M136 250 C150 262 170 262 184 250 L184 272 C170 280 150 280 136 272 Z" fill="#b8734e" stroke="none"/>

    <!-- hair, back volume -->
    <path d="M88 170 C80 128 86 92 102 70 C108 58 118 52 126 52 C132 42 146 38 156 42 C166 32 186 34 194 42 C208 40 222 48 228 60 C242 72 250 96 246 128 C244 150 238 166 232 176 L224 150 L96 150 Z" fill="#614656"/>

    <!-- ears -->
    <path d="M100 160 C86 156 82 172 86 184 C88 196 96 202 104 200 Z" fill="#eab088"/>
    <path d="M220 160 C234 156 238 172 234 184 C232 196 224 202 216 200 Z" fill="#c98660"/>

    <!-- face -->
    <path d="M98 118 L96 160 C97 190 104 212 122 234 C136 248 148 256 160 258 C172 256 184 248 198 234 C216 212 223 190 224 160 L222 118 Z" fill="#f2bd93"/>
    <!-- cel shade, light from the left -->
    <path d="M204 118 L222 118 L224 160 C223 190 216 212 198 234 C184 248 172 256 160 258 C176 244 190 226 199 204 C206 184 209 156 204 118 Z" fill="#d6956b" stroke="none"/>
    <!-- shadow cast by the swept fringe -->
    <path d="M150 112 C176 118 204 122 222 130 L223 146 C206 136 180 130 152 124 Z" fill="#e0a37a" stroke="none"/>

    <!-- short boxed beard joined to the moustache, closed mouth -->
    <path d="M99 184 C101 210 110 226 122 238 C136 250 148 257 160 259 C172 257 184 250 198 238 C210 226 219 210 221 184 C215 202 207 212 196 214 C186 212 174 209 160 209 C146 209 134 212 124 214 C113 212 105 202 99 184 Z" fill="#74524a"/>
    <path d="M144 223 C152 229 168 229 176 223 C168 233 152 233 144 223 Z" fill="#e08f78" stroke="none"/>
    <path d="M144 223 C152 226 168 226 176 223" fill="none" stroke-width="3"/>

    <!-- nose -->
    <path d="M163 178 C165 190 167 197 170 203 C165 207 158 207 154 204 Z" fill="#d6956b" stroke="none"/>
    <path d="M154 205 C158 208 164 208 168 205" fill="none" stroke="#a9653f" stroke-width="3"/>

    <!-- eyes, slightly enlarged so they read on the dot grid -->
    <path d="M115 172 C122 160 142 160 149 172 C142 180 122 180 115 172 Z" fill="#f6f1ec" stroke="none"/>
    <path d="M171 172 C178 160 198 160 205 172 C198 180 178 180 171 172 Z" fill="#f6f1ec" stroke="none"/>
    <circle cx="132" cy="171" r="9.5" fill="#7a4a2c" stroke="none"/>
    <circle cx="188" cy="171" r="9.5" fill="#7a4a2c" stroke="none"/>
    <circle cx="132" cy="171" r="4.5" fill="#1c1626" stroke="none"/>
    <circle cx="188" cy="171" r="4.5" fill="#1c1626" stroke="none"/>
    <circle cx="136" cy="166.5" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="192" cy="166.5" r="3" fill="#ffffff" stroke="none"/>
    <path d="M111 171 C119 156 143 156 152 169" fill="none" stroke-width="6"/>
    <path d="M168 169 C177 156 201 156 209 171" fill="none" stroke-width="6"/>

    <!-- brows -->
    <path transform="translate(0,-5)" d="M108 150 C120 141 137 140 149 146 L148 153 C137 149 122 150 111 157 Z" fill="#33252c"/>
    <path transform="translate(0,-5)" d="M212 150 C200 141 183 140 171 146 L172 153 C183 149 198 150 209 157 Z" fill="#33252c"/>

    <!-- sideburns -->
    <path d="M96 150 L104 150 L104 188 L99 186 Z" fill="#614656" stroke="none"/>
    <path d="M224 150 L216 150 L216 188 L221 186 Z" fill="#614656" stroke="none"/>

    <!-- hair, front: short side-swept crop, parted on the left -->
    <path d="M88 154 C82 122 86 92 102 70 C108 58 118 52 126 52 C132 42 146 38 156 42 C166 32 186 34 194 42 C208 40 222 48 228 60 C242 72 250 96 246 128 L238 154 L226 152 C226 142 224 134 220 128 C206 122 186 118 168 114 C154 111 140 112 130 108 C122 104 118 98 118 94 C110 104 104 118 102 132 L100 154 Z" fill="#614656"/>
    <!-- hair shade on the far side -->
    <path d="M228 60 C242 72 250 96 246 128 L238 154 L226 152 C226 142 224 134 220 128 C228 104 228 80 218 58 Z" fill="#47323f" stroke="none"/>
    <!-- strands following the sweep -->
    <g fill="none" stroke="#3a2a33" stroke-width="3">
      <path d="M120 92 C140 80 172 78 204 92"/>
      <path d="M126 70 C150 58 184 60 214 76"/>
      <path d="M132 104 C156 98 190 102 220 118"/>
      <path d="M104 100 C108 86 116 74 128 66"/>
    </g>
    <!-- highlights -->
    <path d="M136 56 C156 48 182 50 202 60 L198 66 C180 58 158 58 140 64 Z" fill="#a78399" stroke="none"/>
    <path d="M148 86 C166 82 184 84 200 92 L196 97 C182 91 166 90 150 92 Z" fill="#86697d" stroke="none"/>
  </g>
</svg>
